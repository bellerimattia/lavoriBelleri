<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Registrazione Utente</title>

<style>
    body {
        font-family: Verdana, sans-serif;
        background: linear-gradient(120deg, #74ebd5, #ACB6E5);
        margin: 0;
        padding: 0;
    }

    .container {
        width: 600px;
        margin: 40px auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    h2 {
        text-align: center;
        color: #333;
    }

    label {
        font-weight: bold;
        margin-top: 10px;
        display: block;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    .radio-group, .check-group {
        margin-bottom: 15px;
    }

    .radio-group input,
    .check-group input {
        width: auto;
        margin-right: 5px;
    }

    .buttons {
        display: flex;
        gap: 10px;
    }

    button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-validate { background: #007bff; }
    .btn-send { background: #28a745; }
    .btn-print { background: #ff9800; }
</style>
</head>

<body>

<div class="container">
    <h2>Modulo Anagrafica Utente</h2>

    <label>Nome:</label>
    <input type="text" id="nome">

    <label>Cognome:</label>
    <input type="text" id="cognome">

    <label>Indirizzo:</label>
    <input type="text" id="indirizzo">

    <label>Città:</label>
    <input type="text" id="citta">

    <label>Provincia:</label>
    <select id="provincia">
        <option value="">-- Seleziona Provincia --</option>
        <option value="RM">Roma</option>
        <option value="MI">Milano</option>
        <option value="NA">Napoli</option>
        <option value="TO">Torino</option>
        <option value="FI">Firenze</option>
    </select>

    <label>CAP:</label>
    <input type="text" id="cap">

    <label>Username:</label>
    <input type="text" id="username">

    <label>Password:</label>
    <input type="password" id="password">

    <label>Email:</label>
    <input type="text" id="email">

    <label>Età:</label>
    <input type="number" id="eta" min="0" max="120">

    <label>Sesso:</label>
    <div class="radio-group">
        <input type="radio" name="sesso" value="Maschio"> Maschio
        <input type="radio" name="sesso" value="Femmina"> Femmina
        <input type="radio" name="sesso" value="Altro"> Altro
    </div>

    <label>Mezzi di locomozione:</label>
    <div class="check-group">
        <input type="checkbox" name="mezzi" value="Auto"> Auto
        <input type="checkbox" name="mezzi" value="Moto"> Moto
        <input type="checkbox" name="mezzi" value="Bici"> Bici
    </div>

    <label>Materie preferite (max 3):</label>
    <select id="materie" multiple size="5">
        <option>Matematica</option>
        <option>Italiano</option>
        <option>Inglese</option>
        <option>Storia</option>
        <option>Geografia</option>
        <option>Scienze</option>
    </select>

    <div class="buttons">
        <button class="btn-validate" onclick="valida()">Controlla Dati</button>
        <button class="btn-send" onclick="inviaMultiplo()">Invio multiplo</button>
        <button class="btn-print" onclick="vaiAllaStampa()">Stampa dati</button>
    </div>
</div>

<script>

    function inviaMultiplo() {
    
        let nome = document.getElementById("nome").value.trim();
        let cognome = document.getElementById("cognome").value.trim();
        let cap = document.getElementById("cap").value.trim();
        let username = document.getElementById("username").value.trim();
        let password = document.getElementById("password").value.trim();
        let email = document.getElementById("email").value.trim();
        let eta = document.getElementById("eta").value;
  
        let nomeCognomeRegex = /^[A-Za-z]+$/;
        let capRegex = /^[0-9]+$/;
        let usernameRegex = /^[A-Za-z0-9!@#$%^&*._-]{3,16}$/;
        let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        let passwordRegex = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*._-]).{4,}$/;
    
    
        if (nome === "" || !nomeCognomeRegex.test(nome)) {
            alert("Nome non valido: solo lettere.");
            return;
        }
    
        if (cognome === "" || !nomeCognomeRegex.test(cognome)) {
            alert("Cognome non valido: solo lettere.");
            return;
        }
    
        if (!capRegex.test(cap)) {
            alert("CAP non valido: solo numeri.");
            return;
        }
    
        if (!usernameRegex.test(username)) {
            alert("Username non valido: 3-16 caratteri ammessi.");
            return;
        }
    
        if (!passwordRegex.test(password)) {
            alert("Password non valida:\n- minimo 4 caratteri\n- almeno una maiuscola\n- almeno un numero\n- almeno un carattere speciale");
            return;
        }
    
        if (!emailRegex.test(email)) {
            alert("Email non valida.");
            return;
        }
    
        // Se tutti i controlli sono superati
    
        let persone = JSON.parse(localStorage.getItem("persone")) || [];
    
        if (persone.length >= 4) {
            alert("Massimo 4 persone");
            return;
        }
    
        let persona = {
            nome: nome,
            cognome: cognome,
            eta: eta
        };
    
        persone.push(persona);
        localStorage.setItem("persone", JSON.stringify(persone));
    
        alert("Persona inserita (" + persone.length + ")");
    }
    
    function vaiAllaStampa() {
        window.location.href = "stampaNuova.html";
    }
    
</script>

</body>
</html>
