<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica 3.0 – Codice Unico</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: center;
        }

        th {
            background: #ddd;
        }
    </style>
</head>
<body>

<h1 id="titolo"></h1>

<div id="mittente">
    <p>Invio dati anagrafici tramite <strong>localStorage</strong> e indici via <strong>URL</strong>.</p>
    <button onclick="inviaDati()">Invia persone</button>
</div>

<div id="destinatario" style="display:none;">
    <table>
        <thead>
            <tr>
                <th>Indice</th>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Età</th>
            </tr>
        </thead>
        <tbody id="tabella"></tbody>
    </table>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const indiciURL = params.get("indici");

    // SE NON CI SONO PARAMETRI → MITTENTE
    if (!indiciURL) {
        document.getElementById("titolo").innerText = "Pagina Mittente";

        function inviaDati() {

            const persone = [
                { nome: "Gino", cognome: "Latilla", eta: 32 },
                { nome: "Pino", cognome: "Rossi", eta: 42 }
            ];

            // salvataggio localStorage
            localStorage.setItem("persone", JSON.stringify(persone));

            // creazione indici 01, 02
            let indici = [];
            for (let i = 0; i < persone.length; i++) {
                indici.push(String(i + 1).padStart(2, "0"));
            }

            // ricarico la stessa pagina con parametri
            window.location.href = "anagrafica3_unico.html?indici=" + indici.join(",");
        }
    }

    // SE CI SONO PARAMETRI → DESTINATARIO
    else {
        document.getElementById("titolo").innerText = "Pagina Destinatario";
        document.getElementById("mittente").style.display = "none";
        document.getElementById("destinatario").style.display = "block";

        const persone = JSON.parse(localStorage.getItem("persone")) || [];
        const indici = indiciURL.split(",");

        const tbody = document.getElementById("tabella");

        for (let i = 0; i < persone.length; i++) {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${indici[i]}</td>
                <td>${persone[i].nome}</td>
                <td>${persone[i].cognome}</td>
                <td>${persone[i].eta}</td>
            `;

            tbody.appendChild(tr);
        }
    }
</script>

</body>
</html>
