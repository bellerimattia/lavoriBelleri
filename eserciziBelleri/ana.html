<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Anagrafica 3.0</title>

<style>
body {
    font-family: Arial;
    background-color: #eee;
    padding: 20px;
}

input, button {
    display: block;
    margin-top: 8px;
}

table {
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    border: 1px solid black;
    padding: 6px;
}
</style>
</head>

<body>

<h2 id="titolo"></h2>

<!-- ===== MITTENTE ===== -->
<div id="mittente">
    <label>Nome</label>
    <input type="text" id="nome">

    <label>Cognome</label>
    <input type="text" id="cognome">

    <label>Età</label>
    <input type="number" id="eta">

    <button onclick="aggiungi()">Aggiungi persona</button>
    <button onclick="invia()">Invia dati</button>
</div>

<!-- ===== DESTINATARIO ===== -->
<div id="destinatario" style="display:none">
    <table>
        <tr>
            <th>Indice</th>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Età</th>
        </tr>
        <tbody id="tabella"></tbody>
    </table>
</div>

<script>
let parametri = new URLSearchParams(window.location.search);
let indici = parametri.get("indici");

// array globale
let persone = [];

// ===== MITTENTE =====
if (indici == null) {

    document.getElementById("titolo").innerHTML = "Pagina Mittente";

    function aggiungi() {

        let nome = document.getElementById("nome").value;
        let cognome = document.getElementById("cognome").value;
        let eta = document.getElementById("eta").value;

        let persona = {
            nome: nome,
            cognome: cognome,
            eta: eta
        };

        persone.push(persona);

        // pulizia campi
        document.getElementById("nome").value = "";
        document.getElementById("cognome").value = "";
        document.getElementById("eta").value = "";
    }

    function invia() {

        // salvo array nel localStorage
        localStorage.setItem("persone", JSON.stringify(persone));

        // creo indici 01, 02, ...
        let listaIndici = "";
        for (let i = 0; i < persone.length; i++) {
            listaIndici += (i + 1).toString().padStart(2, "0") + ",";
        }

        listaIndici = listaIndici.slice(0, -1);

        // ricarico la pagina con parametri
        window.location.search = "?indici=" + listaIndici;
    }

// ===== DESTINATARIO =====
} else {

    document.getElementById("titolo").innerHTML = "Pagina Destinatario";
    document.getElementById("mittente").style.display = "none";
    document.getElementById("destinatario").style.display = "block";

    let persone = JSON.parse(localStorage.getItem("persone"));
    let arrayIndici = indici.split(",");

    let tabella = document.getElementById("tabella");

    for (let i = 0; i < persone.length; i++) {
        tabella.innerHTML +=
            "<tr>" +
            "<td>" + arrayIndici[i] + "</td>" +
            "<td>" + persone[i].nome + "</td>" +
            "<td>" + persone[i].cognome + "</td>" +
            "<td>" + persone[i].eta + "</td>" +
            "</tr>";
    }
}
</script>

</body>
</html>
