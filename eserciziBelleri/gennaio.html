<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo di Registrazione</title>

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1d2671, #c33764);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }

        .container h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        .form-group label {
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"] {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #c33764;
            box-shadow: 0 0 6px rgba(195, 55, 100, 0.4);
        }

        .form-group input[type="button"] {
            margin-top: 10px;
            padding: 12px;
            background: linear-gradient(135deg, #c33764, #1d2671);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-group input[type="button"]:hover {
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Modulo di Registrazione</h1>

        <form method="post" action="#" name="invio">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" required>
            </div>

            <div class="form-group">
                <label for="telefono">Telefono</label>
                <input type="text" name="telefono" id="telefono" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>

            <div class="form-group">
                <label for="conferma">Conferma Password</label>
                <input type="password" name="conferma" id="conferma" required>
            </div>

            <div class="form-group">
                <input type="button" value="Invia" onclick="valida()">
            </div>
        </form>
    </div>

    <script>
        function valida() {
          
          const nome = document.invio.nome.value;
          const telefono = document.invio.telefono.value;
          const email = document.invio.email.value;
          const password = document.invio.password.value;
          const conferma = document.invio.conferma.value;

          const email_reg_exp =
            /^([a-zA-Z0-9_.-])+@(([a-zA-Z0-9-]{2,})+.)+([a-zA-Z0-9]{2,})+$/;

          const password_reg_exp = /^(?=.*[A-Z])(?=.*[@#$\-_?]).{6,}$/;

          if (!nome) {
            alert("Devi inserire un nome");
            document.invio.nome.focus();
            return false;
          }

          if (isNaN(telefono) || !telefono) {
            alert("Devi inserire il telefono, attenzione deve essere numerico!");
            document.invio.telefono.value = "";
            document.invio.telefono.focus();
            return false;
          }

          if (!email_reg_exp.test(email) || !email) {
            alert("Devi inserire un indirizzo email corretto");
            document.invio.email.focus();
            return false;
          }

          if (!password_reg_exp.test(password) || password.length < 6) {
            alert(
              "La password deve contenere almeno una lettera maiuscola, un carattere speciale (@, #, ?, $, -, _) e almeno 6 caratteri."
            );
            document.invio.password.focus();
            return false;
          }

          if (!conferma) {
            alert("Devi confermare la password");
            document.invio.conferma.focus();
            return false;
          }

          if (password !== conferma) {
            alert("La conferma password non corrisponde");
            document.invio.conferma.value = "";
            document.invio.conferma.focus();
            return false;
          } else {
            document.invio.action = "#";
            document.invio.submit();
          }
        }
    </script>

</body>
</html>
