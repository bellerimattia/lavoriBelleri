<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Generatore Numeri in Griglia Ordinata</title>

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #3f51b5, #2196f3);
      min-height: 100vh;
      margin: 0;
      padding: 30px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1, h2, h3 {
      text-shadow: 0px 2px 6px rgba(0,0,0,0.35);
      margin-bottom: 12px;
    }

    button {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0px 4px 12px rgba(0,0,0,0.25);
      transition: 0.25s;
    }

    button:hover {
      background: rgba(255,255,255,0.35);
      transform: scale(1.05);
    }

    .stats {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px 25px;
      border-radius: 18px;
      width: 90%;
      max-width: 700px;
      backdrop-filter: blur(10px);
      box-shadow: 0px 4px 14px rgba(0,0,0,0.25);
      margin-top: 20px;
      border: 1px solid rgba(255,255,255,0.35);
    }

    .stats p {
      font-size: 18px;
      margin: 4px 0;
    }

    #vettore, #griglia {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.15);
      padding: 18px;
      border-radius: 15px;
      width: 90%;
      max-width: 900px;
      margin-top: 12px;
      box-shadow: 0px 4px 14px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.25);
      font-family: monospace;
      font-size: 16px;
    }

    #vettore span, #griglia span {
      padding: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0px 1px 6px rgba(0,0,0,0.2);
      transition: 0.25s;
      color: #000;
      font-weight: 600;
      backdrop-filter: blur(6px);
    }

    #vettore span:hover, #griglia span:hover {
      transform: scale(1.15);
      background: rgba(255,255,255,0.45);
    }

    #vettore span.alta, #griglia span.alta {
      background: rgba(76, 175, 80, 0.45);
      border-color: rgba(56, 142, 60, 0.8);
      color: #0f3;
    }

    #vettore span.negativo {
      background: rgba(255, 87, 34, 0.35);
      border-color: rgba(244, 67, 54, 0.8);
      color: #c00;
    }
  </style>
</head>

<body>
  <h1>Generatore di Numeri Casuali</h1>

  <button type="button" onclick="generaNumeri()">Genera Numeri</button>

  <div class="stats">
    <h2>Statistiche</h2>
    <p><strong>Media:</strong> <span id="media"></span></p>
    <p><strong>Massimo:</strong> <span id="max"></span></p>
    <p><strong>Minimo:</strong> <span id="min"></span></p>
  </div>

  <h3>Vettore completo:</h3>
  <div id="vettore"></div>

  <h3>Numeri > 50:</h3>
  <div id="griglia"></div>

  <script src="codice.js"></script>
</body>
</html>
