<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagrafica 3.0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<form id="anagraficaForm">
    <h1>Anagrafica 3.0</h1>

    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required>

    <label for="cognome">Cognome</label>
    <input type="text" id="cognome" name="cognome" required>

    <label for="indirizzo">Indirizzo</label>
    <input type="text" id="indirizzo" name="indirizzo">

    <label for="citta">Città</label>
    <input type="text" id="citta" name="citta">

    <label for="cap">CAP</label>
    <input type="text" id="cap" name="cap">

    <label for="eta">Età</label>
    <input type="number" id="eta" name="eta">

    <label for="dataNascita">Data di nascita</label>
    <input type="date" id="dataNascita" name="dataNascita">

    <label>Sesso</label>
    <div class="radio-group">
        <label><input type="radio" name="sesso" value="M"> M</label>
        <label><input type="radio" name="sesso" value="F"> F</label>
        <label><input type="radio" name="sesso" value="Altro"> Altro</label>
    </div>

    <label for="provincia">Provincia</label>
    <select id="provincia" name="provincia">
        <option value="">Seleziona Provincia</option>
        <option value="FI">Firenze</option>
        <option value="BO">Bologna</option>
        <option value="MI">Milano</option>
        <option value="RM">Roma</option>
        <option value="TO">Torino</option>
        <option value="PA">Palermo</option>
        <option value="VE">Venezia</option>
        <option value="NA">Napoli</option>
        <option value="CT">Catania</option>
        <option value="GE">Genova</option>
    </select>

    <label>Materie preferite (max 3)</label>
    <select id="materie" name="materie" multiple>
        <option>Programmazione</option>
        <option>Robotica</option>
        <option>Disegno</option>
        <option>Musica</option>
        <option>Storia dell’arte</option>
        <option>Geografia</option>
        <option>Letteratura</option>
        <option>Scienze</option>
        <option>Educazione fisica</option>
    </select>

    <input type="button" value="Invia dati" onclick="miaFunzione()">
</form>

<div id="output">
    <h2>Dati Inseriti</h2>
    <p>Compila il modulo.</p>
</div>

<script>
function miaFunzione() {
    let persona = {};

    persona.nome = document.getElementById("nome").value;
    persona.cognome = document.getElementById("cognome").value;
    persona.indirizzo = {
        via: document.getElementById("indirizzo").value,
        citta: document.getElementById("citta").value,
        cap: document.getElementById("cap").value
    };
    persona.eta = parseInt(document.getElementById("eta").value);
    persona.dataNascita = document.getElementById("dataNascita").value;

    let radios = document.getElementsByName("sesso");
    persona.sesso = "Non specificato";
    for (let i = 0; i < radios.length; i++) {
        if (radios[i].checked) {
            persona.sesso = radios[i].value;
            break;
        }
    }

    persona.provincia = document.getElementById("provincia").value;

    let checkbox = document.getElementsByName("mezzi");
    persona.mezziPosseduti = [];
    for (let i = 0; i < checkbox.length; i++) {
        if (checkbox[i].checked) persona.mezziPosseduti.push(checkbox[i].value);
    }
    if (persona.mezziPosseduti.length === 0) persona.mezziPosseduti = ["Nessuno"];

    let selected = document.getElementById("materie").selectedOptions;
    persona.materiePreferite = [];
    for (let i = 0; i < selected.length; i++) {
        persona.materiePreferite.push(selected[i].value);
    }
    if (persona.materiePreferite.length === 0) persona.materiePreferite = ["Nessuna"];

    let eta = persona.eta;
    if (eta >= 0 && eta <= 12) persona.generazione = "Generazione Alpha";
    else if (eta >= 13 && eta <= 28) persona.generazione = "Generazione Z";
    else if (eta >= 29 && eta <= 44) persona.generazione = "Millennials";
    else if (eta >= 45 && eta <= 60) persona.generazione = "Generazione X";
    else if (eta >= 61 && eta <= 79) persona.generazione = "Baby Boomers";
    else if (eta >= 80 && eta <= 97) persona.generazione = "Silent Generation";
    else if (eta >= 98) persona.generazione = "Greatest Generation";
    else persona.generazione = "Età non valida o non inserita";

    let html = "<h2>Dati Inseriti</h2>";
    html += "<p><strong>Nome:</strong> " + persona.nome + "</p>";
    html += "<p><strong>Cognome:</strong> " + persona.cognome + "</p>";
    html += "<p><strong>Indirizzo:</strong> " + persona.indirizzo.via + "</p>";
    html += "<p><strong>Città:</strong> " + persona.indirizzo.citta + "</p>";
    html += "<p><strong>CAP:</strong> " + persona.indirizzo.cap + "</p>";
    html += "<p><strong>Età:</strong> " + (persona.eta || "Non specificata") + "</p>";
    html += "<p><strong>Data di nascita:</strong> " + (persona.dataNascita || "Non indicata") + "</p>";
    html += "<p><strong>Sesso:</strong> " + persona.sesso + "</p>";
    html += "<p><strong>Provincia:</strong> " + persona.provincia + "</p>";
    html += "<p><strong>Mezzi posseduti:</strong> " + persona.mezziPosseduti.join(", ") + "</p>";
    html += "<p><strong>Materie preferite:</strong> " + persona.materiePreferite.join(", ") + "</p>";
    html += "<p><strong>Generazione:</strong> " + persona.generazione + "</p>";

    document.getElementById("output").innerHTML = html;
}
</script>

</body>
</html>
