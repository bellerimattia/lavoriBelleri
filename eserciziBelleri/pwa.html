<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWA Riconoscimento Immagini</title>

<link rel="manifest" href="data:application/json,{
  &quot;name&quot;:&quot;Image Recognition PWA&quot;,
  &quot;short_name&quot;:&quot;ImageAI&quot;,
  &quot;start_url&quot;:&quot;./&quot;,
  &quot;display&quot;:&quot;standalone&quot;,
  &quot;background_color&quot;:&quot;#0f172a&quot;,
  &quot;theme_color&quot;:&quot;#7c3aed&quot;
}">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
  background-size: 300% 300%;
  animation: gradientMove 10s ease infinite;
  color: white;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.card {
  width: 95%;
  max-width: 420px;
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(14px);
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  text-align: center;
}

h1 {
  font-size: 26px;
  margin-bottom: 10px;
}

p {
  opacity: 0.9;
  margin-bottom: 20px;
}

input[type="file"] {
  display: none;
}

.upload-btn {
  display: inline-block;
  padding: 12px 22px;
  border-radius: 30px;
  background: linear-gradient(135deg, #22c55e, #06b6d4);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.upload-btn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

img {
  width: 100%;
  margin-top: 20px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  display: none;
}

.result-box {
  margin-top: 18px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(0,0,0,0.25);
  font-size: 18px;
  font-weight: bold;
}

.loader {
  margin-top: 15px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top: 4px solid #fff;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  animation: spin 1s linear infinite;
  display: none;
  margin-left: auto;
  margin-right: auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>
<div class="card">
  <h1>🐶🐱 Image AI</h1>
  <p>Scatta o carica una foto e lascia lavorare l’intelligenza artificiale</p>

  <label class="upload-btn">
    📸 Carica Immagine
    <input type="file" accept="image/*" capture="environment" id="fileInput">
  </label>

  <div class="loader" id="loader"></div>
  <img id="preview" />
  <div class="result-box" id="result">In attesa dell'immagine...</div>
</div>

<script>
let model;
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const result = document.getElementById("result");
const loader = document.getElementById("loader");

async function loadModel() {
  result.innerText = "Caricamento modello AI...";
  model = await mobilenet.load();
  result.innerText = "Modello pronto! 🚀";
}
loadModel();

fileInput.addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const imgURL = URL.createObjectURL(file);
  preview.src = imgURL;
  preview.style.display = "block";

  loader.style.display = "block";
  result.innerText = "Analisi immagine in corso...";

  preview.onload = async () => {
    const predictions = await model.classify(preview);
    const top = predictions[0];
    loader.style.display = "none";
    result.innerText =
      `Risultato: ${top.className} (${(top.probability*100).toFixed(2)}%)`;
  };
});

// Service Worker inline
if ("serviceWorker" in navigator) {
  const swCode = `
    const CACHE = "pwa-cache-v1";
    self.addEventListener("install", e => {
      e.waitUntil(
        caches.open(CACHE).then(c => c.addAll(["./"]))
      );
    });
    self.addEventListener("fetch", e => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], { type: "text/javascript" });
  const swURL = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swURL);
}
</script>
</body>
</html>
